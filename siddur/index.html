<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>סידור</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#122040"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><style>body{font-family:serif;text-align:center;padding:30vh 1em;color:#666}</style></head><body><p id="m">טוען…</p><script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}
(async function(){try{
const parts=await Promise.all(["s1.bin","s2.bin"].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+" "+r.status);return r.arrayBuffer()})));
const all=new Uint8Array(parts[0].byteLength+parts[1].byteLength);all.set(new Uint8Array(parts[0]),0);all.set(new Uint8Array(parts[1]),parts[0].byteLength);
let bytes=all;
if(all[0]===0x1f&&all[1]===0x8b){bytes=new Uint8Array(await new Response(new Blob([all]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());}
let html=new TextDecoder("utf-8").decode(bytes);html=html.replace(/<head([^>]*)>/i,function(m){return m+"<link rel=\"manifest\" href=\"./manifest.webmanifest\"><meta name=\"theme-color\" content=\"#122040\"><link rel=\"icon\" href=\"./icon-192.png\"><link rel=\"apple-touch-icon\" href=\"./apple-touch-icon.png\">"});
const h=location.hash;document.open();document.write(html);document.close();
if(h){setTimeout(function(){var e=document.getElementById(decodeURIComponent(h.slice(1)))||document.getElementsByName(decodeURIComponent(h.slice(1)))[0];if(e)e.scrollIntoView();},50);}
}catch(e){document.getElementById("m").textContent="שגיאה בטעינה — "+e.message;}})();
</script></body></html>
